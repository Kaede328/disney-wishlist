<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant full-bleed background gradient (Land & Sea magical vibe) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7597"/>
      <stop offset="50%" stop-color="#FF8DA9"/>
      <stop offset="100%" stop-color="#FFA87D"/>
    </linearGradient>
    <linearGradient id="motif-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5F7"/>
    </linearGradient>
    <filter id="motif-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7A1D36" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Edge-to-edge square background with NO rounded corners and NO transparency -->
  <rect width="512" height="512" fill="url(#bg-grad)"/>

  <!-- Centered safe-area motif (well within central 65% safe zone) -->
  <g filter="url(#motif-shadow)">
    <!-- Mickey Ears -->
    <circle cx="185" cy="205" r="54" fill="url(#motif-grad)"/>
    <circle cx="327" cy="205" r="54" fill="url(#motif-grad)"/>
    <!-- Head Base -->
    <circle cx="256" cy="285" r="88" fill="url(#motif-grad)"/>

    <!-- Castle & Sea Wave elements inside silhouette -->
    <!-- Main Castle Spire -->
    <polygon points="256,180 266,215 246,215" fill="#FF7597"/>
    <rect x="252" y="215" width="8" height="38" fill="#FF7597"/>
    <!-- Left turret -->
    <polygon points="230,210 237,232 223,232" fill="#FFA085"/>
    <rect x="226" y="232" width="7" height="24" fill="#FFA085"/>
    <!-- Right turret -->
    <polygon points="282,210 289,232 275,232" fill="#FFA085"/>
    <rect x="279" y="232" width="7" height="24" fill="#FFA085"/>

    <!-- Gentle stylized sea wave accent inside bottom of head -->
    <path d="M 218 318 Q 236 308 256 318 Q 276 328 294 318" fill="none" stroke="#FF7597" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Sparkles -->
    <circle cx="256" cy="162" r="4.5" fill="#FFE58F"/>
    <circle cx="150" cy="250" r="3.5" fill="#FFF" opacity="0.9"/>
    <circle cx="362" cy="250" r="3.5" fill="#FFF" opacity="0.9"/>
  </g>

  <!-- Small cute sparkle stars in safe margin -->
  <path d="M 125 155 Q 125 168 112 168 Q 125 168 125 181 Q 125 168 138 168 Q 125 168 125 155 Z" fill="#FFFDE6" opacity="0.8"/>
  <path d="M 387 155 Q 387 168 374 168 Q 387 168 387 181 Q 387 168 400 168 Q 387 168 387 155 Z" fill="#FFFDE6" opacity="0.8"/>
</svg>
